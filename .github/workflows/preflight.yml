name: Track 1 Day-1 Air-Gapped Pre-Flight ($0 LLM)

on:
  workflow_dispatch:
    inputs:
      batch_file:
        description: "Path to candidate JSON batch (e.g. harvest/preflight_batch_ts.json)"
        required: true
        type: string
      ecosystem:
        description: "ts or py"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: |
          python3 - "${{ inputs.batch_file }}" <<'PY'
          import json, os, sys
          items = json.load(open(sys.argv[1]))
          slim = [
            {
              "idx": i,
              "fork_repo": item["fork_repo"],
              "upstream_repo": item["repo"],
              "pr_number": item["pr_number"],
              "default_branch": item["default_branch"],
              "pr_branch": item["fork_pr_branch"],
              "lockfile": item["lockfile"],
              "ecosystem": "${{ inputs.ecosystem }}",
            }
            for i, item in enumerate(items)
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": slim}) + "\n")
          PY

  preflight:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22, pnpm, uv & Pre-Pull Sandbox Image
        run: |
          npm install -g pnpm@10
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [[ "${{ matrix.ecosystem }}" == "ts" ]]; then docker pull -q node:22-bookworm-slim; else docker pull -q python:3.12-slim; fi

      - name: Pre-Flight Baseline main (exit 0 offline) & PR branch (exit != 0 offline)
        env:
          FORK_REPO: ${{ matrix.fork_repo }}
          DEFAULT_BRANCH: ${{ matrix.default_branch }}
          PR_BRANCH: ${{ matrix.pr_branch }}
          ECOSYSTEM: ${{ matrix.ecosystem }}
          UPSTREAM_REPO: ${{ matrix.upstream_repo }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set +e
          mkdir -p /tmp/pf-results

          prep_branch() {
            local branch="$1"
            local label="$2"
            rm -rf "/tmp/clean-${label}" "/tmp/cache-${label}"
            git clone --depth 1 --branch "${branch}" "https://github.com/${FORK_REPO}.git" "/tmp/clean-${label}" >/tmp/clone_${label}.log 2>&1
            if [[ $? -ne 0 ]]; then echo 91; return; fi
            rm -rf "/tmp/clean-${label}/.github"
            git -C "/tmp/clean-${label}" remote remove origin
            bash scripts/phase3a_cache.sh "/tmp/clean-${label}" "${ECOSYSTEM}" "/tmp/cache-${label}" >/tmp/p3a_${label}.log 2>&1
            local p3a=$?
            if [[ $p3a -ne 0 ]]; then echo "30${p3a}"; return; fi
            echo 0
          }

          VERIFY_MODE="test"
          MAIN_EXIT=99
          PR_EXIT=99
          P_MAIN=$(prep_branch "${DEFAULT_BRANCH}" "main")
          if [[ "${P_MAIN}" != "0" ]]; then
            MAIN_EXIT="${P_MAIN}"
          else
            bash scripts/phase3b_docker_test.sh /tmp/clean-main "${ECOSYSTEM}" /tmp/cache-main "" /tmp/test_main.log test
            MAIN_EXIT=$?
            if [[ "${MAIN_EXIT}" == "0" ]]; then
              P_PR=$(prep_branch "${PR_BRANCH}" "pr")
              if [[ "${P_PR}" != "0" ]]; then
                PR_EXIT="${P_PR}"
              else
                bash scripts/phase3b_docker_test.sh /tmp/clean-pr "${ECOSYSTEM}" /tmp/cache-pr "" /tmp/test_pr.log test
                PR_EXIT=$?
                # If test passed on both main & PR, probe build/typecheck (TS) or ruff/ty/mypy (Py) to reproduce exact failing CI gate!
                if [[ "${PR_EXIT}" == "0" ]]; then
                  if [[ "${ECOSYSTEM}" == "ts" ]]; then PROBES="typecheck build"; else PROBES="ruff ty mypy black"; fi
                  for mode in ${PROBES}; do
                    bash scripts/phase3b_docker_test.sh /tmp/clean-main "${ECOSYSTEM}" /tmp/cache-main "" "/tmp/probe_main_${mode}.log" "${mode}"
                    PM=$?
                    if [[ $PM -eq 0 ]]; then
                      bash scripts/phase3b_docker_test.sh /tmp/clean-pr "${ECOSYSTEM}" /tmp/cache-pr "" "/tmp/probe_pr_${mode}.log" "${mode}"
                      PP=$?
                      if [[ $PP -ne 0 && $PP -ne 127 ]]; then
                        VERIFY_MODE="${mode}"
                        PR_EXIT=$PP
                        cp "/tmp/probe_pr_${mode}.log" /tmp/test_pr.log
                        break
                      fi
                    fi
                  done
                fi
              fi
            fi
          fi

          SAFE_NAME=$(echo "${UPSTREAM_REPO}" | tr '/' '_')
          python3 - <<PY
          import json, os
          out = {
            "upstream_repo": "${UPSTREAM_REPO}",
            "fork_repo": "${FORK_REPO}",
            "pr_number": int("${PR_NUMBER}"),
            "ecosystem": "${ECOSYSTEM}",
            "verify_mode": "${VERIFY_MODE}",
            "main_exit_code": int("${MAIN_EXIT}"),
            "pr_exit_code": int("${PR_EXIT}"),
            "clean_baseline_eligible": (int("${MAIN_EXIT}") == 0 and int("${PR_EXIT}") != 0 and int("${PR_EXIT}") < 300),
            "main_log_tail": open("/tmp/test_main.log").read()[-1200:] if os.path.exists("/tmp/test_main.log") else open("/tmp/p3a_main.log").read()[-1200:] if os.path.exists("/tmp/p3a_main.log") else "",
            "pr_log_tail": open("/tmp/test_pr.log").read()[-1200:] if os.path.exists("/tmp/test_pr.log") else "",
          }
          open("/tmp/pf-results/${SAFE_NAME}.json", "w").write(json.dumps(out, indent=2))
          print(json.dumps({k: v for k, v in out.items() if not k.endswith("_tail")}))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ matrix.ecosystem }}-${{ matrix.idx }}
          path: /tmp/pf-results/*.json
          retention-days: 7
